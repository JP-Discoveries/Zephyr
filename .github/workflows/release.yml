name: Release

# Runs only when you push a version tag, e.g.:
#   git tag v1.0.0
#   git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create the GitHub Release and upload assets

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish (self-contained win-x64)
        run: >
          dotnet publish Zephyr.UI/Zephyr.UI.csproj
          -c Release -r win-x64 --self-contained true
          -o publish

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath "Zephyr-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "Zephyr-${{ github.ref_name }}-win-x64.zip"
          --title "Zephyr ${{ github.ref_name }}"
          --generate-notes
